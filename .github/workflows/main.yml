name: Mumbai Traffic Data Collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run the data extractor
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: python mumbai_triggered_extractor.py

      - name: Commit and push updated CSV logs
        run: |
          git config --global user.name "traffic-bot"
          git config --global user.email "actions@github.com"

          git add mumbai_traffic_log.csv mumbai_weather_log.csv

          if ! git diff --staged --quiet; then
            git commit -m "Auto: traffic/weather data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No new data changes to commit"
          fi
