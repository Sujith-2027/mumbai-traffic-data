name: Mumbai adaptive collector
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mumbai-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          DAILY_CAP: ${{ vars.DAILY_CAP || '600' }}
        run: python collector.py
      - name: Commit data
        run: |
          git config user.name "traffic-bot"
          git config user.email "actions@github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push
          fi
