name: Mumbai Traffic Data Collector

# This is the "trigger" - it runs the extractor automatically,
# in GitHub's cloud, every 15 minutes, forever, for free.
# Your laptop does not need to be on for this to work.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # lets you also trigger it manually from GitHub's UI

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run the extractor
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: python mumbai_triggered_extractor.py

      - name: Commit and push updated CSV logs
        run: |
          git config --global user.name "traffic-bot"
          git config --global user.email "actions@github.com"
          git add mumbai_traffic_log.csv mumbai_weather_log.csv
          git diff --staged --quiet || git commit -m "Auto: traffic/weather data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
